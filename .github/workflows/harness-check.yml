name: AI harness checks

on:
  push:
    paths:
      - '.agents/**'
      - '.claude/**'
      - 'docs/**/*.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/harness-check.yml'
  pull_request:
    paths:
      - '.agents/**'
      - '.claude/**'
      - 'docs/**/*.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/harness-check.yml'

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check -r .agents/requirements-dev.txt
      - name: Test harness checks with isolated fixtures
        run: python -B -m unittest discover -s .agents/tests -p 'test_*.py'
      - name: Validate the repository harness offline
        run: python -B .agents/scripts/check_harness.py
      - name: Verify checks left the checkout unchanged
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
